workflows:
  android_debug:
    name: Z50000 Révision V2 Android
    max_build_duration: 40
    environment:
      flutter: 3.41.5
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Build debug APK
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
